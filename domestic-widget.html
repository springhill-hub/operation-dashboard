function rowsOf(p){
  return (DATA[p].shops||[]).map(r => ({
    name:r.shop, channel:r.channel, orders:r.orders,
    gmv:r.gmv, refund:r.refund||0, net:r.gmv,
    aov: r.orders ? r.gmv/r.orders : 0
  }));
}
function filteredRows(rows){ return rows.filter(r => filterChannels.has(r.channel)); }
const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
function totals(rows){
  const t = {orders:0, gmv:0, refund:0, net:0};
  for(const r of rows){ t.orders+=r.orders; t.refund+=r.refund; t.net+=r.gmv; }

  t.aov = t.orders ? r2(t.net/t.orders) : 0;
  return t;
}
function pct(cur, prev){
  if(prev==null||prev===0||cur==null) return null;

}
const arrHTML = p => {
  if(p==null) return '<span style="color:var(--sub)">—</span>';
  return `<span class="${p>=0?'pos':'neg'}">${p>=0?'▲':'▼'} ${Math.abs(p)}%</span>`;
};

// ========== 渠道聚合（图表用） ==========
function channelAgg(rows){
  const m = {};
  for(const r of rows){
    m[r.channel] = m[r.channel] || {channel:r.channel, orders:0, gmv:0, refund:0, net:0};
    m[r.channel].orders += r.orders; m[r.channel].gmv = r2(m[r.channel].gmv + r.gmv + r.refund); m[r.channel].refund = r2(m[r.channel].refund + r.refund); m[r.channel].net = r2(m[r.channel].net + r.gmv);
  }
  return Object.values(m).sort((a,b)=>b.net-a.net);
}

// ========== KPI ==========
function kpiHTML(t, prev){
  const dGmv=pct(t.gmv,prev&&prev.gmv), dNet=pct(t.net,prev&&prev.net),
        dOrd=pct(t.orders,prev&&prev.orders), dAov=pct(t.aov,prev&&prev.aov);
  const refundRate = t.gmv ? (t.refund/t.gmv*100) : 0;
  return `<div class="kpis">
    <div class="kpi"><div class="lb">支付GMV（含取消单）</div><div class="v gmv kpi-num" data-val="${t.gmv}" data-prefix="¥">¥0</div>
      <div class="s">退款率 ${refundRate.toFixed(1)}%（取消口径）</div>
      <div class="s">环比 ${arrHTML(dGmv)}</div></div>
    <div class="kpi"><div class="lb">净销售额（支付GMV−取消退款）</div><div class="v net kpi-num" data-val="${t.net}" data-prefix="¥">¥0</div>
      <div class="s">取消退款 ¥${fmt0(t.refund)}</div>
      <div class="s">环比 ${arrHTML(dNet)}</div></div>
    <div class="kpi"><div class="lb">有效订单数</div><div class="v ord kpi-num" data-val="${t.orders}">0<span class="cur">单</span></div>
      <div class="s">另取消 ${prev!=null?'':''}订单（详见表格）</div>
      <div class="s">环比 ${arrHTML(dOrd)}</div></div>
    <div class="kpi"><div class="lb">客单价（净销售口径）</div><div class="v kpi-num" data-val="${t.aov}" data-prefix="¥">¥0</div>
      <div class="s">净销售额 ÷ 有效订单数</div>
      <div class="s">环比 ${arrHTML(dAov)}</div></div>
  </div>`;
}

// ========== 环形图（渠道净销售占比） ==========
function donutHTML(chs, metric){
  const items = chs.filter(c=>(metric==='net'?c.net:c.gmv)>0)
    .map(c=>({name:c.channel, value: metric==='net'?c.net:c.gmv, color:colorOf(c.channel)}))
    .sort((a,b)=>b.value-a.value);
  if(!items.length) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">暂无可统计数据</div>';
  const total = items.reduce((s,i)=>s+i.value,0);
  const R=70, r=42, cx=90, cy=90, len=2*Math.PI*R;
  let acc=0;
  const segs = items.map((it,idx)=>{
    const frac = it.value/total, off = -acc*len, dur = .8+idx*.15;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${it.color}" stroke-width="${R-r}"
      stroke-dasharray="${(frac*len).toFixed(2)} ${(len*(1-frac)).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"
      style="animation:drawDonut ${dur}s ease both; --len:${len}; --off:${off.toFixed(2)}"
      data-name="${it.name}" data-val2="${fmt0(it.value)}" data-pct2="${(frac*100).toFixed(1)}"/>`;
  }).join('');
  const label = metric==='net'?'净销售额':'支付GMV';
  const legend = items.map(it=>`<div class="li"><span class="dot" style="background:${it.color}"></span>${it.name} ${fmt0(it.value)} (${(it.value/total*100).toFixed(1)}%)</div>`).join('');
  return `<div class="svg-box" style="position:relative">
    <svg viewBox="0 0 180 180" width="180" height="180">${segs}
      <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="var(--sub)" font-size="10">${label}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" fill="var(--gold)" font-size="14" font-weight="700">${fmt0(total)}</text>
      <text x="${cx}" y="${cy+26}" text-anchor="middle" fill="var(--sub)" font-size="9">CNY</text>
    </svg><div class="chart-tip" id="donutTip"></div></div>
    <div class="chart-legend">${legend}</div>`;
}

// ========== 渠道条形对比（含退款率） ==========
function chanBarsHTML(chs, metric){
  const items = chs.filter(c=>(metric==='net'?c.net:c.gmv)>0)
    .map(c=>({...c, value: metric==='net'?c.net:c.gmv})).sort((a,b)=>b.value-a.value);
  if(!items.length) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">暂无数据</div>';
  const max = items[0].value;
  const rows = items.map(c=>{
    const rr = c.gmv ? (c.refund/c.gmv*100) : 0;
    const rrCls = rr>=30?'bad':rr>=15?'warn':'ok';
    return `<div class="bar-row">
      <div style="display:flex;align-items:center;gap:6px"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${colorOf(c.channel)};display:inline-block"></span>${c.channel}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${(c.value/max*100).toFixed(1)}" style="background:linear-gradient(90deg,${colorOf(c.channel)}88,${colorOf(c.channel)})"></div></div>
      <div class="bar-num">¥${fmt0(c.value)} <span class="tag ${rrCls}" title="取消退款÷(支付GMV+取消退款)">退${rr.toFixed(0)}%</span></div>
    </div>`;
  }).join('');
  return `<div class="bars">${rows}</div>`;
}

// ========== 近30日趋势 ==========
function trendHTML(d){
  const arr = d.dailyTrend || [];
  if(arr.length<2) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">数据点不足（单日周期）</div>';
  const W=400, H=190, padL=44, padB=34, padT=14;
  const plotW=W-padL-8, plotH=H-padT-padB;
  const max = Math.max(...arr.map(x=>x.gmv));
  const bw = plotW/arr.length*0.68;
  const bars = arr.map((x,i)=>{
    const h = x.gmv/max*plotH;
    const x0 = padL + i*(plotW/arr.length) + (plotW/arr.length-bw)/2;
    const y = padT+plotH-h;
    const isLast = i===arr.length-1;
    return `<g class="bar-grp" data-name="${x.date}" data-val="¥${fmt0(x.gmv)}" data-ord="${x.orders}单">
      <rect x="${x0}" y="${y}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${isLast?'var(--fire)':'var(--green)'}" rx="2" opacity="${isLast?1:.8}" style="animation:growHeight .8s ease ${i*.02}s both; --h:${Math.max(h,1).toFixed(1)}px"/>
      ${i%Math.ceil(arr.length/10)===0?`<text x="${x0+bw/2}" y="${H-18}" text-anchor="middle" fill="var(--sub)" font-size="8">${x.date.slice(5)}</text>`:''}
    </g>`;
  }).join('');
  const grid = [0.5,1].map(f=>`<line x1="${padL}" y1="${padT+plotH-plotH*f}" x2="${W-8}" y2="${padT+plotH-plotH*f}" stroke="var(--line)" stroke-dasharray="3,3"/>
    <text x="${padL-6}" y="${padT+plotH-plotH*f+3}" text-anchor="end" fill="var(--sub)" font-size="9">${fmt0(max*f/1000)}k</text>`).join('');
  return `<div class="svg-box" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    ${grid}${bars}</svg><div class="chart-tip" id="trendTip"></div></div>
    <div style="font-size:11px;color:var(--sub);text-align:center;margin-top:6px">绿色=历史日 ｜ 橙色=今日 ｜ 悬停查看单日GMV与订单数</div>`;
}

// ========== 店铺明细表（可排序） ==========
function tableHTML(rows){
  const sorted = [...rows].sort((a,b)=>{
    const get = r => sortCol==='name'?r.name:(r[sortCol]==null?-Infinity:r[sortCol]);
    const va=get(a), vb=get(b);
    if(va===vb) return 0;
    return sortDir==='asc' ? (va>vb?1:-1) : (va<vb?1:-1);
  });
  const sortCls = c => c===sortCol ? (sortDir==='asc'?'sort sort-asc':'sort sort-desc') : 'sort';
  const tr = sorted.map(r=>{
    const rr = (r.gmv+r.refund) ? (r.refund/(r.gmv+r.refund)*100) : 0;
    return `<tr>
      <td class="pf">${r.name}<span class="tag mut" style="background:${colorOf(r.channel)}22;color:${colorOf(r.channel)}">${r.channel}</span></td>
      <td>${r.orders}</td>
      <td>¥${fmt0(r.gmv)}</td>
      <td>${r.refund>0?`<span class="neg">¥${fmt0(r.refund)}</span>`:'—'}<span style="font-size:10px;color:var(--sub)"> ${rr>0?rr.toFixed(0)+'%':''}</span></td>
      <td><b>¥${fmt0(r.net)}</b></td>
      <td>¥${fmt(r.aov)}</td>
    </tr>`;
  }).join('');
  return `<div class="sec"><h2>店铺明细（点击表头排序 ｜ 渠道芯片可筛选）</h2>
  <div class="table-wrap"><table><thead><tr>
    <th class="${sortCls('name')}" data-col="name">店铺</th>
    <th class="${sortCls('orders')}" data-col="orders">有效订单</th>
    <th class="${sortCls('gmv')}" data-col="gmv">支付GMV</th>
    <th class="${sortCls('refund')}" data-col="refund">取消退款</th>
    <th class="${sortCls('net')}" data-col="net">净销售额</th>
    <th class="${sortCls('aov')}" data-col="aov">客单价</th>
  </tr></thead><tbody>${tr}</tbody></table></div></div>`;
}

// ========== SKU TOP20 ==========
function skuHTML(d){
  const list = d.skuTop || [];
  if(!list.length) return '<div class="sec"><h2>动销SKU TOP20</h2><div style="color:var(--sub);padding:20px;text-align:center">本周期暂无SKU明细</div></div>';
  const max = list[0].amount || 1;
  const totalAmt = list.reduce((s,r)=>s+r.amount,0);
  const rowHTML = (r,i,cls)=>`<tr${cls?` class="${cls}"`:''}>
    <td class="pf"><div style="display:flex;align-items:center;gap:10px">
      <div style="position:relative;flex-shrink:0"><span class="sku-rank" style="position:absolute;top:-6px;left:-6px;background:var(--green);color:#141518;font-size:9px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center">${i}</span>
      <div class="sku-ph" style="width:38px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#262930;border:1px solid var(--line);font-size:10px;color:var(--sub)">${r.qty}件</div></div>
      <div style="min-width:0"><div style="font-family:monospace;font-size:12px;word-break:break-all">${r.skuId}</div>${r.name?`<div style="font-size:11px;color:var(--sub);margin-top:2px;line-height:1.3;max-width:340px">${r.name}</div>`:''}</div>
    </div></td>
    <td>${r.qty}</td>
    <td>¥${fmt0(r.amount)}</td>
    <td style="min-width:120px"><div class="bar-track" style="height:14px"><div class="bar-fill o" data-w="${(r.amount/max*100).toFixed(1)}"></div></div>
    <div style="font-size:11px;color:var(--sub);margin-top:3px">${(r.amount/totalAmt*100).toFixed(1)}%</div></td>
  </tr>`;
  const rest = list.slice(10);
  return `<div class="sec"><h2>动销SKU TOP20（按销售额降序 · 不含取消订单）</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>SKU / 产品</th><th>销量</th><th>销售额</th><th style="text-align:right">销售额占比</th></tr></thead>
    <tbody>
      ${list.slice(0,10).map((r,i)=>rowHTML(r,i+1)).join('')}
      ${rest.map((r,i)=>rowHTML(r,i+11,'sku-rest hidden')).join('')}
    </tbody></table></div>
    ${rest.length?`<div style="margin-top:10px;text-align:center">
      <button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px">展开剩余 ${rest.length} 条 ▼</button></div>`:''}
    <div style="margin-top:12px;font-size:12px;color:var(--sub);line-height:1.9">
      · SKU销售额为商品行金额合计，与订单GMV存在组合装/运费分摊差异<br>
      · 成本与毛利维度待财务校准SOP接入后补充（聚水潭出库单成本接口首版未通）
    </div></div>`;
}

// ========== 渲染 ==========
function render(p){
  curPeriod = p;
  const d = DATA[p];
  const allRows = rowsOf(p);
  const rows = filteredRows(allRows);
  const t = totals(rows);
  const prevMap = {today:'yesterday', week:'lastWeek', month:'lastMonth'};
  const prev = prevMap[p] ? totals(filteredRows(rowsOf(prevMap[p]))) : null;
  const chs = channelAgg(rows);
  const metricLabel = curMetric==='net'?'净销售额':'支付GMV';
  let html = `<div class="fade">${filtersHTML()}
  ${kpiHTML(t, prev)}
  <div class="chart-grid">
    <div class="chart-card"><h3>渠道占比（${metricLabel}）</h3>${donutHTML(chs,curMetric)}</div>
    <div class="chart-card"><h3>渠道对比（含退款率标注）</h3>${chanBarsHTML(chs,curMetric)}</div>
    <div class="chart-card"><h3>日GMV趋势（本周期）</h3>${trendHTML(d)}</div>
  </div>
  <div class="grid2">
    <div>${tableHTML(rows)}</div>
    <div><div class="sec"><h2>口径说明</h2><div class="note">
    · <b>支付口径</b>：按支付时间(pay_date)归期，仅含已付款订单<br>
    · 净销售额 = 支付GMV − 取消退款（status=Cancelled且已支付）<br>
    · 客单价 = 净销售额 ÷ 有效订单数<br>
    · <b class="r">取消退款含刷单未剔除</b>：真实GMV=支付GMV−退款−刷单，刷单标记待财务校准（8月取消率异常偏高即为刷单所致）<br>
    · <b class="r">渠道缺口</b>：天猫/淘宝/京东/微店/拼多多已在聚水潭授权，但订单未进入OpenAPI（待开启订单下载），本看板暂不覆盖<br>
    · 部分退款（items级refund_qty）与平台佣金未含，待财务校准SOP接入<br>
    · 数据T+0实时拉取，存在平台推送延迟（今日数据偏低属正常）<br>
    · 勾稽校验：渠道合计=总盘（meta.reconcile=${DATA.meta.reconcile||'OK'}）<br>
    · 环比：今日vs昨日 / 本周vs上周 / 本月vs上月（滚动7天对齐）<br>
    · 点击表头排序 ｜ 点击渠道芯片筛选</div></div></div>
  </div>
  ${skuHTML(d)}</div>`;
  document.getElementById('panel').innerHTML = html;
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%');
    document.querySelectorAll('.kpi .v[data-val]').forEach(animateNum);
    bindChartTips();
    bindSort();
    bindFilters();
  });
}

// ========== 筛选器 ==========
function filtersHTML(){
  const chips = CHANNELS.map(c=>{
    const on = filterChannels.has(c);
    return `<span class="chip ${on?'on':''}" data-p="${c}"><span class="dot" style="background:${colorOf(c)}"></span>${c}</span>`;
  }).join('');
  const metricBtns = [{k:'net',l:'净销售额'},{k:'gmv',l:'支付GMV'}]
    .map(m=>`<button class="${curMetric===m.k?'on':''}" data-m="${m.k}">${m.l}</button>`).join('');
  return `<div class="filters">
    <div class="filter-group"><span class="label">渠道筛选：</span>${chips}</div>
    <div class="metric-switch">${metricBtns}</div></div>`;
}

// ========== 数字滚动 ==========
function animateNum(el){
  const target = parseFloat(el.dataset.val);
  if(isNaN(target)) return;
  const prefix = el.dataset.prefix||'';
  const curEl = el.querySelector('.cur');
  const curHTML = curEl?curEl.outerHTML:'';
  const dur = 900, t0 = performance.now();
  function step(t){
    const p = Math.min((t-t0)/dur,1);
    const v = target*(1-Math.pow(1-p,3));
    el.innerHTML = prefix+fmt0(v)+curHTML;
    if(p<1) requestAnimationFrame(step);
    else el.innerHTML = prefix+fmt0(target)+curHTML;
  }
  requestAnimationFrame(step);
}

// ========== 图表 tooltip ==========
function bindChartTips(){
  const bind = (segSel, tipId) => {
    const tip = document.getElementById(tipId);
    if(!tip) return;
    document.querySelectorAll(segSel).forEach(seg=>{
      seg.addEventListener('mousemove', e=>{
        tip.innerHTML = `<b style="color:${seg.getAttribute('stroke')||'var(--green)'}">${seg.dataset.name}</b><br>${seg.dataset.val||''}${seg.dataset.ord?'<br>'+seg.dataset.ord:''}${seg.dataset.pct2?`<br>占比：${seg.dataset.pct2}%`:''}`;
        tip.classList.add('on');
        tip.style.left = (e.pageX+12)+'px';
        tip.style.top = (e.pageY+12)+'px';
      });
      seg.addEventListener('mouseleave', ()=>tip.classList.remove('on'));
    });
  };
  bind('.donut-seg','donutTip');
  bind('.bar-grp','trendTip');
}

// ========== 表格排序 ==========
function bindSort(){
  document.querySelectorAll('th.sort').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.col;
      if(sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
      else { sortCol=col; sortDir='desc'; }
      render(curPeriod);
    });
  });
}

// ========== 筛选绑定 ==========
function bindFilters(){
  document.querySelectorAll('.chip[data-p]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const p = chip.dataset.p;
      if(filterChannels.has(p)) filterChannels.delete(p);
      else filterChannels.add(p);
      render(curPeriod);
    });
  });
  document.querySelectorAll('.metric-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{ curMetric = btn.dataset.m; render(curPeriod); });
  });
}

// SKU 展开（事件委托）
document.addEventListener('click', e => {
  const btn = e.target.closest('#skuToggle');
  if(btn){
    const rows = document.querySelectorAll('tr.sku-rest');
    if(!rows.length) return;
    const hidden = rows[0].classList.contains('hidden');
    rows.forEach(r=>r.classList.toggle('hidden', !hidden));
    btn.textContent = hidden ? '收起 ▲' : `展开剩余 ${rows.length} 条 ▼`;
  }
});

// Tab 切换
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  render(t.dataset.p);
}));

render('today');
</script>
</body>
</html>
