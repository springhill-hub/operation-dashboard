<meta name="description" content="春山户外经营利润看板：KPI四卡+三图表+平台筛选+指标切换+表格排序，今日/本周/本月三Tab">
<title>春山户外 · 经营看板</title>
<style>
:root{
  --bg:#141518; --card:#1d1f24; --card2:#23262c; --line:#33363e;
  --txt:#e8e6e1; --sub:#9a9da6; --fire:#ff7a3c; --gold:#f5c66a;
  --green:#4cc38a; --red:#e5534b; --blue:#5b9dd9; --jpy:#f5c66a;
  --c1:#ff7a3c; --c2:#5b9dd9; --c3:#4cc38a; --c4:#f5c66a; --c5:#b07cd6; --c6:#e5534b; --c7:#7eb8c9; --c8:#d6a06e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border:2px solid var(--fire);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--fire);font-size:20px;letter-spacing:-1px}
h1{font-size:22px;letter-spacing:1px}
h1 small{display:block;font-size:11px;color:var(--sub);letter-spacing:3px;font-weight:400;margin-top:3px}
.meta{text-align:right;font-size:12px;color:var(--sub);line-height:1.7}
.meta b{color:var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:13px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--sub);font-size:14px;transition:.25s;position:relative;overflow:hidden}
.tab:hover{color:var(--txt)}
.tab.on{background:linear-gradient(160deg,#2a2318,#1d1f24);border-color:var(--fire);color:var(--fire);font-weight:600}
.tab .d{font-size:11px;color:var(--sub);margin-top:3px;font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--fire),transparent 70%)}
.kpi .lb{font-size:12px;color:var(--sub)}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.kpi .s{font-size:11px;color:var(--sub);margin-top:4px}
.kpi .v.cny{color:var(--gold)}
.kpi .v.gp{color:var(--fire)}
.kpi .v.mg{color:var(--green)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.sec h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:3px;height:14px;background:var(--fire);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--sub);font-weight:500;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 10px;text-align:right;border-bottom:1px solid #262930;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:#22252b}
td.pf{font-weight:600}
.neg{color:var(--red)}
.pos{color:var(--green)}
.cur{font-size:10px;color:var(--sub);margin-left:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;margin-left:6px}
.tag.warn{background:#3a2f1a;color:var(--gold)}
.tag.bad{background:#3a1f1e;color:var(--red)}
.tag.ok{background:#16312a;color:var(--green)}
.tag.mut{background:#2a2d34;color:var(--sub)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:16px;background:#262930;border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#b8551f,var(--fire));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar-fill.g{background:linear-gradient(90deg,#2d7a56,var(--green))}
.bar-num{font-size:12px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.note{font-size:12px;color:var(--sub);line-height:2}
.note b{color:var(--gold)}
.note .r{color:var(--red)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rule{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.8}
.rule b{color:var(--fire);display:block;margin-bottom:4px;font-size:12px}
.hidden{display:none}
footer{margin-top:26px;text-align:center;font-size:11px;color:#5d616b;letter-spacing:1px}
.fade{animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 新增：筛选器 ============ */
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-group .label{font-size:12px;color:var(--sub);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;background:var(--card2);border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;transition:.2s;user-select:none}
.chip:hover{border-color:var(--fire)}
.chip.on{background:#2a2318;border-color:var(--fire);color:var(--fire)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip:not(.on) .dot{opacity:.4}
.metric-switch{display:flex;gap:4px;background:var(--card2);border-radius:8px;padding:3px}
.metric-switch button{background:none;border:none;color:var(--sub);font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:.2s;font-family:inherit}
.metric-switch button.on{background:var(--fire);color:#1a1a1a;font-weight:600}

/* ============ 新增：图表网格 ============ */
.chart-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.chart-card h3{font-size:13px;color:var(--sub);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.chart-card h3::before{content:"";width:3px;height:12px;background:var(--blue);border-radius:2px}
.svg-box{width:100%;display:flex;justify-content:center;align-items:center}
.svg-box svg{max-width:100%;height:auto}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:11px;color:var(--sub)}
.chart-legend .li{display:flex;align-items:center;gap:5px}
.chart-legend .li .dot{width:9px;height:9px;border-radius:2px}
.chart-tip{position:absolute;background:#0d0e10;border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:99;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.chart-tip.on{opacity:1}

/* ============ 新增：表格排序 ============ */
th.sort{cursor:pointer;user-select:none;transition:color .2s}
th.sort:hover{color:var(--fire)}
th.sort::after{content=" ↕";opacity:.3;font-size:10px}
th.sort-asc::after{content=" ↑";opacity:1;color:var(--fire)}
th.sort-desc::after{content=" ↓";opacity:1;color:var(--fire)}
.table-wrap{overflow-x:auto;border-radius:8px}

/* ============ SKU 产品缩略图 ============ */
.sku-ph{width:46px;height:46px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#262930;border:1px solid var(--line);flex-shrink:0;font-size:10px;color:var(--sub)}
.sku-ph img{width:100%;height:100%;border-radius:6px;object-fit:cover;display:block}
.sku-rank{position:absolute;top:-5px;left:-5px;background:var(--fire);color:#141518;font-size:9px;font-weight:700;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;z-index:2}

/* ============ 新增：动画 ============ */
@keyframes drawDonut{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:var(--off)}}
@keyframes growBar{from{width:0}to{width:var(--w)}}
@keyframes growHeight{from{height:0}to{height:var(--h)}}
.kpi{animation:fadeUp .5s ease both}
.kpi .v{transition:color .3s}
@keyframes countUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpi-num{display:inline-block;transition:opacity .3s}

/* ============ 移动端优化 ============ */
@media(max-width:900px){
  .grid2{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .filters{flex-direction:column;align-items:stretch}
  .filter-group{justify-content:flex-start}
  .bar-row{grid-template-columns:90px 1fr 110px;font-size:12px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs{gap:6px}
  .tab{font-size:12px;padding:10px 0}
  .tab .d{font-size:10px}
  h1{font-size:18px}
  .kpi .v{font-size:22px}
}
@media(max-width:600px){
  .wrap{padding:18px 12px 40px}
  .chart-card{padding:14px}
  .sec{padding:14px}
  th,td{padding:7px 6px;font-size:12px}
}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('DATA-JSON').textContent);
const R = DATA.meta.jpyRate;
const fmt = n => Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2});
const fmt0 = n => Number(Math.round(n)).toLocaleString('zh-CN');
const CNY = j => j*R;

// 平台颜色映射
const COLORS = ['#ff7a3c','#5b9dd9','#4cc38a','#f5c66a','#b07cd6','#e5534b','#7eb8c9','#d6a06e'];
const KNOW={'泰国shopee':'泰国-Shopee','马来shopee':'马来-Shopee','独立站-日本':'独立站-日本','独立站-国际':'独立站-国际'};
const ALL_PLATFORMS = ['日本-亚马逊','美国-亚马逊','独立站-日本','独立站-国际','泰国-Shopee','马来-Shopee','日本-乐天','韩国-Coupang'];

// 状态
let curPeriod = 'today';
let filterPlatforms = new Set(ALL_PLATFORMS);
let curMetric = 'net'; // net | profit | margin
let sortCol = 'profit';
let sortDir = 'desc';

// 平台行构建
function amzRow(p, a, tagNote){
  const c = a.currency||'JPY';
  return {name:p, currency:c, qty:a.qty, refund:a.refQty, net:a.net,
    cost:a.cost, feeMain:a.commission, fbaD:a.fbaDeliv, storage:a.storage, ads:a.ads, other:a.other,
    profit:a.gp, margin:a.margin, note:tagNote||'含税'+fmt0(a.salesAmt)+'−税'+fmt0(a.tax), tagCls:a.qty===0?'mut':'ok'};
}
function stRows(settlement, knowMap){
  const out=[];
  for(const [name,s] of Object.entries(settlement)){
    const known = knowMap[name]||name;
    let tag='ok', note='结算口径';
    if(name.includes('独立站')){ tag='warn'; note='Shopify手续费未录入，利润率虚高3-5pp'; }
    out.push({name:known, currency:s.currency, qty:s.qty, refund:s.refundVol, net:s.net,
      cost:s.productCost, feeMain:s.commission, fbaD:s.delivery, storage:s.storage+s.otherLogistics,
      ads:s.ads, other:s.otherPlatformFee+s.serviceFee+s.affiliate+s.otherPromo,
      profit:s.profit, margin:parseFloat(s.margin)||0, note, tagCls:tag});
  }
  return out;
}

function rowsOf(p){
  const rows=[amzRow('日本-亚马逊',p.amazonJP), amzRow('美国-亚马逊',p.amazonUS,'无销售，仅仓储杂费')];
  rows.push(...stRows(p.settlement,KNOW));
  rows.push({name:'日本-乐天',currency:'JPY',qty:null,net:null,profit:null,margin:null,cost:null,note:'领星不覆盖结算，需后台导出归集',tagCls:'bad'});
  rows.push({name:'韩国-Coupang',currency:'KRW',qty:null,net:null,profit:null,margin:null,cost:null,note:'领星不覆盖结算，需后台导出归集',tagCls:'bad'});
  return rows;
}

function filteredRows(rows){
  return rows.filter(r => filterPlatforms.has(r.name));
}

function totals(rows){
  const t={qty:0,net:0,profit:0};
  for(const r of rows){ if(r.currency==='JPY'&&r.net!=null){t.qty+=r.qty||0;t.net+=r.net;t.profit+=r.profit||0;} }
  t.margin=t.net?+(t.profit/t.net*100).toFixed(2):0;
  return t;
}

function pct(cur, prev){
  if(prev==null||prev===0||cur==null) return null;
  return +(((cur-prev)/Math.abs(prev))*100).toFixed(1);
}
const arrHTML = p => {
  if(p==null) return '<span style="color:var(--sub)">—</span>';
  const cls = p>=0?'pos':'neg';
  const icon = p>=0?'▲':'▼';
  return `<span class="${cls}">${icon} ${Math.abs(p)}%</span>`;
};

// ========== SVG 环形图 ==========
function donutHTML(rows, metric){
  const valid = rows.filter(r=>r.profit!=null && r.currency==='JPY' && (metric==='net'?r.net:r.profit)!=null);
  if(!valid.length) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">暂无JPY口径数据</div>';
  const items = valid.map(r=>({
    name:r.name, value: metric==='net'? r.net : r.profit,
    color: COLORS[ALL_PLATFORMS.indexOf(r.name)%COLORS.length]
  })).filter(i=>i.value>0).sort((a,b)=>b.value-a.value);
  if(!items.length) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">无正值数据</div>';
  const total = items.reduce((s,i)=>s+i.value,0);
  const R=70, r=42, cx=90, cy=90;
  const len = 2*Math.PI*R;
  let acc=0;
  const segs = items.map((it,idx)=>{
    const frac = it.value/total;
    const off = -acc*len;
    const dur = .8+idx*.15;
    acc += frac;
    return `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${it.color}" stroke-width="${R-r}" 
      stroke-dasharray="${(frac*len).toFixed(2)} ${(len*(1-frac)).toFixed(2)}" 
      stroke-dashoffset="${off.toFixed(2)}" 
      transform="rotate(-90 ${cx} ${cy})" 
      style="animation:drawDonut ${dur}s ease both; --len:${len}; --off:${off.toFixed(2)}"
      data-name="${it.name}" data-val="${fmt0(it.value)}" data-pct="${(frac*100).toFixed(1)}"
      class="donut-seg" />`;
  }).join('');
  const centerVal = metric==='net'?'净销售额':metric==='profit'?'毛利润':'';
  const legend = items.map(it=>`<div class="li"><span class="dot" style="background:${it.color}"></span>${it.name} ${fmt0(it.value)} (${(it.value/total*100).toFixed(1)}%)</div>`).join('');
  return `<div class="svg-box" style="position:relative">
    <svg viewBox="0 0 180 180" width="180" height="180">${segs}
      <text x="${cx}" y="${cy-6}" text-anchor="middle" fill="var(--sub)" font-size="10">${centerVal}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" fill="var(--gold)" font-size="14" font-weight="700">${fmt0(total)}</text>
      <text x="${cx}" y="${cy+26}" text-anchor="middle" fill="var(--sub)" font-size="9">JPY</text>
    </svg>
    <div class="chart-tip" id="donutTip"></div>
    </div>
    <div class="chart-legend">${legend}</div>`;
}

// ========== SVG 堆叠横向条 ==========
function stackedHTML(rows, metric){
  const valid = rows.filter(r=>r.profit!=null && r.currency==='JPY' && (metric==='net'?r.net:r.profit)!=null && (metric==='net'?r.net:r.profit)>0);
  if(!valid.length) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">暂无JPY口径数据</div>';
  const items = valid.map(r=>({
    name:r.name, value: metric==='net'? r.net : r.profit, margin: r.margin,
    color: COLORS[ALL_PLATFORMS.indexOf(r.name)%COLORS.length]
  })).sort((a,b)=>b.value-a.value);
  const max = items[0].value;
  const barH = 24, gap = 8, labelW = 90, valW = 90;
  const svgH = items.length * (barH+gap) + 20;
  const trackW = 320;
  const bars = items.map((it,idx)=>{
    const w = (it.value/max*trackW).toFixed(1);
    const y = idx*(barH+gap)+10;
    return `<g class="bar-grp" data-name="${it.name}" data-val="${fmt0(it.value)}" data-margin="${it.margin}%">
      <text x="${labelW-8}" y="${y+barH/2+4}" text-anchor="end" fill="var(--txt)" font-size="11">${it.name}</text>
      <rect x="${labelW}" y="${y}" width="${trackW}" height="${barH}" fill="#262930" rx="4"/>
      <rect x="${labelW}" y="${y}" width="0" height="${barH}" fill="${it.color}" rx="4" style="animation:growBar 1s ease ${idx*.1}s both; --w:${w}px"/>
      <text x="${labelW+trackW+8}" y="${y+barH/2+4}" fill="var(--sub)" font-size="11">${fmt0(it.value)} <tspan fill="${it.margin>=35?'var(--green)':it.margin>=20?'var(--gold)':'var(--red)'}">${it.margin}%</tspan></text>
    </g>`;
  }).join('');
  return `<div class="svg-box"><svg viewBox="0 0 ${labelW+trackW+valW} ${svgH}" width="100%" height="${svgH}">${bars}</svg></div>`;
}

// ========== SVG 瀑布图（日亚费用拆解） ==========
function waterfallHTML(d){
  const a = d.amazonJP;
  if(!a || a.net==null) return '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0">日亚数据不可得</div>';
  const steps = [
    {label:'净销售额', value:a.net, type:'base'},
    {label:'商品成本', value:a.cost, type:'cost'},
    {label:'平台扣点', value:a.commission, type:'cost'},
    {label:'FBA派送', value:a.fbaDeliv, type:'cost'},
    {label:'FBA仓储', value:a.storage, type:'cost'},
    {label:'广告费', value:a.ads, type:'cost'},
    {label:'其他', value:a.other, type:'cost'},
    {label:'毛利润', value:a.gp, type:'result'}
  ];
  const W=400, H=200, padL=70, padR=20, padT=20, padB=40;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const maxAbs = Math.max(...steps.map(s=>Math.abs(s.value)));
  const scale = plotH/maxAbs;
  const barW = plotW/steps.length*0.6;
  const gap = plotW/steps.length;
  let cumTop = a.net;
  const bars = steps.map((s,idx)=>{
    const x = padL + idx*gap + (gap-barW)/2;
    if(s.type==='base'){
      const h = Math.abs(s.value)*scale;
      const y = padT+plotH-h;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--blue)" rx="3"/>
        <text x="${x+barW/2}" y="${y-5}" text-anchor="middle" fill="var(--txt)" font-size="9">${fmt0(s.value)}</text>
        <text x="${x+barW/2}" y="${H-padB+14}" text-anchor="middle" fill="var(--sub)" font-size="9">${s.label}</text>`;
    } else if(s.type==='cost'){
      const h = Math.abs(s.value)*scale;
      const y = padT + (a.net - cumTop)*scale;
      cumTop += s.value;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(h,1)}" fill="var(--red)" rx="3" opacity=".85"/>
        <text x="${x+barW/2}" y="${y-5}" text-anchor="middle" fill="var(--red)" font-size="9">${fmt0(s.value)}</text>
        <text x="${x+barW/2}" y="${H-padB+14}" text-anchor="middle" fill="var(--sub)" font-size="9">${s.label}</text>
        ${idx<steps.length-2?`<line x1="${x+barW}" y1="${y}" x2="${x+gap}" y2="${y}" stroke="var(--line)" stroke-dasharray="2,2"/>`:''}`;
    } else {
      const h = Math.abs(s.value)*scale;
      const y = padT+plotH-h;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="var(--green)" rx="3"/>
        <text x="${x+barW/2}" y="${y-5}" text-anchor="middle" fill="var(--green)" font-size="9">${fmt0(s.value)}</text>
        <text x="${x+barW/2}" y="${H-padB+14}" text-anchor="middle" fill="var(--green)" font-size="9" font-weight="600">${s.label}</text>`;
    }
  }).join('');
  return `<div class="svg-box"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${bars}</svg></div>
    <div style="font-size:11px;color:var(--sub);margin-top:8px;text-align:center">日本亚马逊费用拆解 · 蓝色=净销售额 ｜ 红色=费用项 ｜ 绿色=毛利润</div>`;
}

// ========== KPI ==========
function kpiHTML(t,label,prev,yoy){
  const dNet=pct(t.net,prev&&prev.net), dGp=pct(t.profit,prev&&prev.profit), dQty=pct(t.qty,prev&&prev.qty);
  const yoyNet=yoy&&pct(t.net,yoy.net), yoyGp=yoy&&pct(t.profit,yoy.gp), yoyQty=yoy&&pct(t.qty,yoy.qty);
  return `<div class="kpis">
    <div class="kpi"><div class="lb">净销售额（不含税·JPY口径）</div><div class="v cny" data-val="${t.net}" data-prefix="¥">¥0</div><div class="s">≈ ${fmt(CNY(t.net))} CNY</div>
      <div class="s">环比 ${arrHTML(dNet)}${yoyNet!=null?` ｜ 同比 ${arrHTML(yoyNet)}`:''}</div></div>
    <div class="kpi"><div class="lb">销量（JPY口径店铺合计）</div><div class="v" data-val="${t.qty}">0<span class="cur">单</span></div><div class="s">含退货标注见明细</div>
      <div class="s">环比 ${arrHTML(dQty)}${yoyQty!=null?` ｜ 同比 ${arrHTML(yoyQty)}`:''}</div></div>
    <div class="kpi"><div class="lb">毛利润（未含头程）</div><div class="v gp" data-val="${t.profit}" data-prefix="¥">¥0</div><div class="s">≈ ${fmt(CNY(t.profit))} CNY</div>
      <div class="s">环比 ${arrHTML(dGp)}${yoyGp!=null?` ｜ 同比 ${arrHTML(yoyGp)}`:''}</div></div>
    <div class="kpi"><div class="lb">毛利率</div><div class="v mg" data-val="${t.margin}" data-suffix="%">0%</div><div class="s">${prev&&prev.margin?`上期 ${prev.margin}%`:'真实利润需再扣头程运费'}</div>
      <div class="s">${prev&&prev.margin?`变动 ${(t.margin-prev.margin>=0?'+':'')+(t.margin-prev.margin).toFixed(2)}pp`:'数据来源：领星ERP'}</div></div>
  </div>`;
}

// ========== 表格（带排序） ==========
function tableHTML(rows){
  const sorted = [...rows].sort((a,b)=>{
    const get = r => sortCol==='name' ? r.name : (r[sortCol]==null?-Infinity:r[sortCol]);
    const va=get(a), vb=get(b);
    if(va===vb) return 0;
    return sortDir==='asc' ? (va>vb?1:-1) : (va<vb?1:-1);
  });
  const sortCls = c => c===sortCol ? (sortDir==='asc'?'sort sort-asc':'sort sort-desc') : 'sort';
  const tr = sorted.map(r=>{
    const qty = r.qty==null?'—':r.qty;
    const net = r.net==null?'—':fmt0(r.net);
    const profit = r.profit==null?'—':`<span class="${r.profit<0?'neg':'pos'}">${fmt0(r.profit)}</span>`;
    const mg = r.margin==null?'—':`<span style="${r.margin>=35?'color:var(--green)':r.margin<20?'color:var(--red)':''}">${r.margin}%</span>`;
    const tag = r.note?`<span class="tag ${r.tagCls}">${r.note}</span>`:'';
    const feeDetail = (r.feeMain!=null&&r.net!=null)
      ? `扣点${fmt0(r.feeMain)} / 派送${fmt0(r.fbaD||0)} / 仓储${fmt0(r.storage||0)} / 广告${fmt0(r.ads||0)} / 其他${fmt0(r.other||0)}`
      : '—';
    return `<tr>
      <td class="pf">${r.name}${tag}</td>
      <td>${qty}</td><td>${net}<span class="cur">${r.currency||''}</span></td>
      <td>${r.cost!=null?fmt0(r.cost):'—'}</td>
      <td style="font-size:11px;color:var(--sub);text-align:right">${feeDetail}</td>
      <td>${profit}</td><td>${mg}</td></tr>`;
  }).join('');
  return `<div class="sec"><h2>平台利润明细（点击表头排序 · 费用已含FBA尾程派送/仓储/扣点/广告）</h2>
  <div class="table-wrap"><table><thead><tr>
    <th class="${sortCls('name')}" data-col="name">平台</th>
    <th class="${sortCls('qty')}" data-col="qty">销量</th>
    <th class="${sortCls('net')}" data-col="net">净销售额</th>
    <th class="${sortCls('cost')}" data-col="cost">商品成本</th>
    <th>平台费用明细（原币）</th>
    <th class="${sortCls('profit')}" data-col="profit">毛利润</th>
    <th class="${sortCls('margin')}" data-col="margin">毛利率</th>
  </tr></thead><tbody>${tr}</tbody></table></div></div>`;
}

// ========== 条形图 ==========
function barsHTML(rows){
  const valid = rows.filter(r=>r.profit!=null&&r.profit>0).sort((a,b)=>b.profit-a.profit);
  const max = valid[0]?valid[0].profit:1;
  const items = valid.map(r=>`<div class="bar-row">
    <div>${r.name}</div>
    <div class="bar-track"><div class="bar-fill" data-w="${(r.profit/max*100).toFixed(1)}"></div></div>
    <div class="bar-num">${fmt0(r.profit)} ${r.currency}</div></div>`).join('');
  const loss = rows.filter(r=>r.profit!=null&&r.profit<0).map(r=>`<span class="tag bad">${r.name} ${fmt0(r.profit)} ${r.currency}</span>`).join(' ');
  return `<div class="sec"><h2>利润贡献结构</h2><div class="bars">${items}</div>
  ${loss?`<div style="margin-top:12px;font-size:12px;color:var(--sub)">亏损项：${loss}</div>`:''}</div>`;
}

// ========== 筛选器 ==========
function filtersHTML(rows){
  const chips = ALL_PLATFORMS.map(p=>{
    const r = rows.find(x=>x.name===p);
    const hasData = r && r.net!=null;
    const color = COLORS[ALL_PLATFORMS.indexOf(p)%COLORS.length];
    const on = filterPlatforms.has(p);
    return `<span class="chip ${on?'on':''}" data-p="${p}">
      <span class="dot" style="background:${color}"></span>${p}${hasData?'':` <span style="opacity:.5">·无数据</span>`}
    </span>`;
  }).join('');
  const metricBtns = [
    {k:'net',l:'净销售额'},
    {k:'profit',l:'毛利润'}
  ].map(m=>`<button class="${curMetric===m.k?'on':''}" data-m="${m.k}">${m.l}</button>`).join('');
  return `<div class="filters">
    <div class="filter-group">
      <span class="label">平台筛选：</span>
      ${chips}
    </div>
    <div class="metric-switch">${metricBtns}</div>
  </div>`;
}

// ========== 数字滚动动画 ==========
function animateNum(el){
  const target = parseFloat(el.dataset.val);
  if(isNaN(target)){ return; }
  const prefix = el.dataset.prefix||'';
  const suffix = el.dataset.suffix||'';
  const isInt = Number.isInteger(target);
  const dur = 900;
  const t0 = performance.now();
  const curEl = el.querySelector('.cur');
  const curHTML = curEl?curEl.outerHTML:'';
  // 初始设为0
  el.innerHTML = prefix+(isInt?'0':'0')+suffix+curHTML;
  function step(t){
    const p = Math.min((t-t0)/dur,1);
    const e = 1-Math.pow(1-p,3);
    const v = target*e;
    const formatted = isInt ? fmt0(v) : fmt(v);
    el.innerHTML = prefix+formatted+suffix+curHTML;
    if(p<1) requestAnimationFrame(step);
    else el.innerHTML = prefix+(isInt?fmt0(target):fmt(target))+suffix+curHTML;
  }
  requestAnimationFrame(step);
}

// ========== 渲染 ==========
function render(p){
  curPeriod = p;
  const d = DATA[p];
  const allRows = rowsOf(d);
  const rows = filteredRows(allRows);
  const t = totals(rows);
  const prevMap = {today:'yesterday', week:'lastWeek', month:'lastMonth'};
  const prev = prevMap[p] ? totals(filteredRows(rowsOf(DATA[prevMap[p]]))) : null;
  let yoy = null;
  if(p==='month' && DATA.lastYearSep && DATA.lastYearSep.amazonJP){
    const ly = totals(filteredRows(rowsOf(DATA.lastYearSep)));
    yoy = {net: ly.net, gp: ly.profit, qty: ly.qty};
  }
  const metricLabel = curMetric==='net'?'净销售额':'毛利润';
  let html = `<div class="fade">${filtersHTML(allRows)}${kpiHTML(t,'今日',prev,yoy)}
  <div class="chart-grid">
    <div class="chart-card"><h3>平台占比（${metricLabel} · JPY口径）</h3>${donutHTML(rows,curMetric)}</div>
    <div class="chart-card"><h3>${metricLabel}对比（含毛利率标注）</h3>${stackedHTML(rows,curMetric)}</div>
    <div class="chart-card"><h3>日亚费用拆解瀑布图</h3>${waterfallHTML(d)}</div>
  </div>
  <div class="grid2">
    <div>${tableHTML(rows)}</div>
    <div>${barsHTML(rows)}
    <div class="sec"><h2>口径说明</h2><div class="note">
    · 净销售额 = 含税销售额 − 消费税(10%)<br>
    · 毛利润 = 平台收入 + 平台费用 + 商品成本<br>
    · 平台费用 = 扣点 + FBA派送 + FBA仓储 + 广告 + 其他<br>
    · <b class="r">头程运费（中国→海外仓）暂未计入</b><br>
    · Shopee为结算口径（滞后7-10天）<br>
    · 环比：今日vs昨日 / 本周vs上周 / 本月vs上月<br>
    · 同比：本月vs去年9月（仅日亚口径）<br>
    · 点击表头排序 ｜ 点击平台芯片筛选 ｜ 切换指标查看不同视角</div></div></div>
  </div>
  ${skuDetailHTML(d)}</div>`;
  document.getElementById('panel').innerHTML = html;
  // 触发动画
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%');
    document.querySelectorAll('.kpi .v[data-val]').forEach(animateNum);
    bindChartTips();
    bindSort();
    bindFilters();
    bindSkuChips();
  });
}

// ========== SKU 利润构成区块 ==========
let curSkuPlatform = null;
function skuDetailHTML(d){
  const candidates=[];
  if(d.amazonJP && Array.isArray(d.amazonJP.skuDetail) && d.amazonJP.skuDetail.length)
    candidates.push({name:'日本-亚马逊', list:d.amazonJP.skuDetail, total:d.amazonJP.gp, currency:'JPY'});
  if(d.amazonUS && Array.isArray(d.amazonUS.skuDetail) && d.amazonUS.skuDetail.length)
    candidates.push({name:'美国-亚马逊', list:d.amazonUS.skuDetail, total:d.amazonUS.gp, currency:'USD'});
  for(const [k,s] of Object.entries(d.settlement||{})){
    if(Array.isArray(s.skuDetail) && s.skuDetail.length)
      candidates.push({name:KNOW[k]||k, list:s.skuDetail, total:s.profit, currency:s.currency});
  }
  if(!candidates.length){
    return '<div class="sec"><h2>SKU利润构成</h2><div style="color:var(--sub);padding:20px;text-align:center">本周口径暂无SKU明细，请切换"今日"或"本月"查看</div></div>';
  }
  // 默认选利润最高的
  if(!curSkuPlatform || !candidates.find(c=>c.name===curSkuPlatform)){
    curSkuPlatform = [...candidates].sort((a,b)=>b.total-a.total)[0].name;
  }
  const cur = candidates.find(c=>c.name===curSkuPlatform);
  const list = cur.list.slice().sort((a,b)=>b.profit-a.profit);
  const top10 = list.slice(0,10);
  const rest = list.slice(10);

  const imgCell = r => r.img
    ? `<div class="sku-ph"><img src="${r.img}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="skuImgErr(this)"></div>`
    : `<div class="sku-ph">无图</div>`;
  const rowHTML = (r,i)=>`<tr>
    <td class="pf"><div style="display:flex;align-items:center;gap:10px">
      <div style="position:relative;flex-shrink:0"><span class="sku-rank">${i}</span>${imgCell(r)}</div>
      <div style="min-width:0"><div style="font-family:monospace;font-size:12px;word-break:break-all">${r.msku}</div>${r.name?`<div style="font-size:11px;color:var(--sub);margin-top:2px;line-height:1.3">${r.name}</div>`:''}</div>
    </div></td>
    <td>${r.qty}</td>
    <td>${fmt0(r.net)}<span class="cur">${cur.currency}</span></td>
    <td>${fmt0(r.cost)}</td>
    <td>${fmt0(r.platformFee)}</td>
    <td class="${r.profit<0?'neg':'pos'}" style="font-weight:600">${fmt0(r.profit)}</td>
    <td><span style="${r.margin>=35?'color:var(--green)':r.margin<20&&r.margin>0?'color:var(--red)':''}">${r.margin}%</span></td>
    <td style="min-width:120px">
      <div class="bar-track" style="height:14px"><div class="bar-fill ${r.profit<0?'':'g'}" data-w="${Math.min(Math.abs(r.pct),100).toFixed(1)}"></div></div>
      <div style="font-size:11px;color:var(--sub);margin-top:3px">${r.pct}%</div>
    </td>
  </tr>`;

  const chips = candidates.map(c=>{
    const color = COLORS[ALL_PLATFORMS.indexOf(c.name)%COLORS.length];
    return `<span class="chip ${c.name===curSkuPlatform?'on':''}" data-skup="${c.name}">
      <span class="dot" style="background:${color}"></span>${c.name} <span style="opacity:.7">(${c.list.length})</span>
    </span>`;
  }).join('');

  return `<div class="sec"><h2>SKU利润构成（按平台切换 · Top 10 按毛利降序 · 占比=该SKU利润/店铺总利润）</h2>
    <div class="filter-group" style="margin-bottom:14px;flex-wrap:wrap">${chips}</div>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>MSKU / 产品</th>
        <th>销量</th>
        <th>净销售额</th>
        <th>商品成本</th>
        <th>平台费用</th>
        <th>毛利润</th>
        <th>毛利率</th>
        <th style="text-align:right">利润贡献占比</th>
      </tr></thead>
      <tbody>
        ${top10.map((r,i)=>rowHTML(r,i+1)).join('')}
        ${rest.map((r,i)=>`<tr class="sku-rest hidden">${rowHTML(r,i+11).replace('<tr>','').replace('</tr>','')}</tr>`).join('')}
      </tbody>
    </table></div>
    ${rest.length?`<div style="margin-top:10px;text-align:center">
      <button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;transition:.2s">展开剩余 ${rest.length} 条 ▼</button>
    </div>`:''}
    <div style="margin-top:14px;font-size:12px;color:var(--sub);line-height:1.9">
      · 数据源：领星ERP · 利润口径（已结算，滞后7-10天）<br>
      · 亚马逊走 get_profit_report_msku；独立站/Shopee 走 finance_settlement_profit_list<br>
      · 仅展示 Top 20 SKU（按毛利绝对值降序）｜ 占比 = 该 SKU 利润 / 店铺总利润<br>
      · 产品主图来源：亚马逊主图 / Shopify CDN / Shopee CDN（共97/100，3个组合装虚拟行无在线商品故无图）<br>
      · <b class="r">独立站 Shopify 手续费未录入，利润率虚高 3-5pp</b><br>
      · SKU利润构成用于经营决策"有的放矢"，把重心花在该花的地方
    </div>
  </div>`;
}

// 图片加载失败降级
function skuImgErr(el){
  const d = document.createElement('div');
  d.className = 'sku-ph'; d.textContent = '无图';
  el.parentNode.replaceWith(d);
}

function bindSkuChips(){
  document.querySelectorAll('.chip[data-skup]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      curSkuPlatform = chip.dataset.skup;
      render(curPeriod);
    });
  });
  const btn = document.getElementById('skuToggle');
  if(btn){
    btn.addEventListener('click',()=>{
      const rows = document.querySelectorAll('tr.sku-rest');
      const hidden = rows[0] && rows[0].classList.contains('hidden');
      rows.forEach(r=>r.classList.toggle('hidden', !hidden));
      btn.innerHTML = hidden ? `收起 ▲` : `展开剩余 ${rows.length} 条 ▼`;
    });
  }
}

// ========== 图表 tooltip ==========
function bindChartTips(){
  const tip = document.getElementById('donutTip');
  if(!tip) return;
  document.querySelectorAll('.donut-seg').forEach(seg=>{
    seg.addEventListener('mousemove', e=>{
      tip.innerHTML = `<b style="color:${seg.getAttribute('stroke')}">${seg.dataset.name}</b><br>金额：${seg.dataset.val} JPY<br>占比：${seg.dataset.pct}%`;
      tip.classList.add('on');
      tip.style.left = (e.pageX+12)+'px';
      tip.style.top = (e.pageY+12)+'px';
    });
    seg.addEventListener('mouseleave', ()=>tip.classList.remove('on'));
  });
}

// ========== 表格排序 ==========
function bindSort(){
  document.querySelectorAll('th.sort').forEach(th=>{
    th.addEventListener('click', ()=>{
      const col = th.dataset.col;
      if(sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
      else { sortCol=col; sortDir='desc'; }
      render(curPeriod);
    });
  });
}

// ========== 筛选器 ==========
function bindFilters(){
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const p = chip.dataset.p;
      if(filterPlatforms.has(p)) filterPlatforms.delete(p);
      else filterPlatforms.add(p);
      render(curPeriod);
    });
  });
  document.querySelectorAll('.metric-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      curMetric = btn.dataset.m;
      render(curPeriod);
    });
  });
}

// ========== Tab 切换 ==========
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  render(t.dataset.p);
}));

render('today');
</script>
