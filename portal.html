<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春山户外 · 智能经营中枢</title>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2333;--line:#30363d;
  --txt:#e6edf3;--sub:#8b949e;--fire:#ff7a3c;--gold:#f5c66a;
  --green:#4cc38a;--blue:#6ea8fe;--purple:#bc8cff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.logo-area{text-align:center;margin-bottom:32px}
.logo{width:64px;height:64px;border:2px solid var(--fire);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--fire);font-size:28px;margin-bottom:16px}
h1{font-size:22px;letter-spacing:1px;margin-bottom:4px}
h1 small{display:block;font-size:11px;color:var(--sub);letter-spacing:3px;font-weight:400;margin-top:4px}
.version{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:11px;color:var(--sub);margin-top:8px}
.form-group{margin-bottom:20px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:12px 16px;font-size:15px;outline:none;transition:border-color .2s}
input[type=password]:focus{border-color:var(--fire)}
.btn{width:100%;background:linear-gradient(135deg,var(--fire),#e55a2b);border:none;border-radius:8px;color:#fff;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,122,60,.3)}
.remember{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:var(--sub);cursor:pointer}
.remember input{width:auto}
.error{background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}
/* 导航页 */
.nav-container{max-width:900px;width:100%;padding:20px}
.nav-header{text-align:center;margin-bottom:40px}
.nav-header .logo{width:56px;height:56px;font-size:24px;margin-bottom:12px}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.nav-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-decoration:none;color:var(--txt);transition:.25s;display:block}
.nav-card:hover{transform:translateY(-4px);border-color:var(--fire);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.nav-card .icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px}
.nav-card.g .icon{background:rgba(76,195,138,.15)}
.nav-card.b .icon{background:rgba(110,168,254,.15)}
.nav-card.p .icon{background:rgba(188,140,255,.15)}
.nav-card h2{font-size:17px;margin-bottom:6px}
.nav-card p{font-size:13px;color:var(--sub);line-height:1.6}
.nav-card .arrow{float:right;color:var(--sub);font-size:18px;margin-top:-40px}
.nav-footer{text-align:center;margin-top:32px;font-size:12px;color:var(--sub)}
.hidden{display:none}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-card" id="loginView">
  <div class="logo-area">
    <div class="logo">春</div>
    <h1>春山户外<small>智能经营中枢</small></h1>
    <div class="version">v2.0.0 · 双口径数据引擎</div>
  </div>
  <div class="error" id="errMsg">口令错误，请重试</div>
  <div class="form-group">
    <label>访问口令</label>
    <input type="password" id="pwd" placeholder="请输入口令" autocomplete="current-password">
  </div>
  <label class="remember">
    <input type="checkbox" id="remember"> 记住口令（7天）
  </label>
  <button class="btn" onclick="doLogin()">进入系统</button>
</div>

<!-- 导航页 -->
<div class="nav-container hidden" id="navView">
  <div class="nav-header">
    <div class="logo">春</div>
    <h1>春山户外<small>智能经营中枢</small></h1>
    <div class="version">v2.0.0 · 双口径数据引擎</div>
  </div>
  <div class="nav-grid">
    <a class="nav-card g" href="dashboard.html" target="_blank">
      <div class="icon">📊</div>
      <h2>外盘经营看板</h2>
      <p>亚马逊/乐天/Coupang/Shopee/独立站<br>下单口径·结算口径·双轨并行</p>
      <span class="arrow">→</span>
    </a>
    <a class="nav-card b" href="domestic.html" target="_blank">
      <div class="icon">🇨🇳</div>
      <h2>内盘经营看板</h2>
      <p>天猫/京东/抖音/小红书<br>支付口径·成本口径·实时同步</p>
      <span class="arrow">→</span>
    </a>
    <a class="nav-card p" href="inventory.html" target="_blank">
      <div class="icon">📦</div>
      <h2>库存管理看板</h2>
      <p>云端总仓·聚水潭·跨境仓<br>安全库存·周转预警·缺货提醒</p>
      <span class="arrow">→</span>
    </a>
  </div>
  <div class="nav-footer">
    春山户外 · 数据驱动决策 · 每日 08:30 自动刷新
  </div>
</div>

<script>
// 口令 MD5 = 春山户外2026（可改）
const PWD_HASH = '8f7d3c2a1b9e4f5a6c7d8e9f0a1b2c3d'; // 占位，实际用下面简单比对
const VALID_PWD = 'springhill2026'; // 实际口令
const STORE_KEY = 'chunshan_auth';
const EXPIRE_DAYS = 7;

function doLogin(){
  const pwd = document.getElementById('pwd').value;
  const remember = document.getElementById('remember').checked;
  if(pwd === VALID_PWD){
    if(remember){
      const exp = Date.now() + EXPIRE_DAYS * 86400000;
      localStorage.setItem(STORE_KEY, JSON.stringify({pwd, exp}));
    }
    showNav();
  } else {
    document.getElementById('errMsg').style.display = 'block';
    setTimeout(()=>document.getElementById('errMsg').style.display='none', 3000);
  }
}

function showNav(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('navView').classList.remove('hidden');
}

function checkAuth(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    const {pwd, exp} = JSON.parse(raw);
    if(Date.now() > exp){ localStorage.removeItem(STORE_KEY); return false; }
    return pwd === VALID_PWD;
  } catch(e){ return false; }
}

// 回车提交
document.getElementById('pwd').addEventListener('keydown', e=>{
  if(e.key==='Enter') doLogin();
});

// 已记住则直接进导航
if(checkAuth()) showNav();
</script>
</body>
</html>
