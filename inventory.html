<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>春山户外 · 库存管理看板</title>
<style>
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2333;--line:#30363d;
  --txt:#e6edf3;--sub:#8b949e;--green:#3fb950;--red:#f85149;
  --yellow:#d29922;--blue:#6ea8fe;--orange:#db6d28;--purple:#bc8cff;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6}
.header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.header .logo{width:28px;height:28px;background:linear-gradient(135deg,var(--green),var(--blue));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--bg)}
.header .meta{font-size:12px;color:var(--sub)}
.container{max-width:1400px;margin:0 auto;padding:20px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;scroll-margin-top:70px}
.sec h2{font-size:14px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sec h2 .sub{font-size:12px;color:var(--sub);font-weight:400}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--card);padding:16px 18px}
.kpi .label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .v{font-size:24px;font-weight:700;font-family:'SF Mono',monospace}
.kpi .v small{font-size:13px;color:var(--sub);font-weight:400;margin-left:4px}
.kpi .delta{font-size:11px;margin-top:4px}
.kpi.pos .v{color:var(--green)}
.kpi.neg .v{color:var(--red)}
.kpi.warn .v{color:var(--yellow)}
.kpi.info .v{color:var(--blue)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--sub);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--txt)}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:var(--card2)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yellow)}
.bar-track{width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.bar-fill.g{background:var(--green)}.bar-fill.r{background:var(--red)}.bar-fill.b{background:var(--blue)}.bar-fill.y{background:var(--yellow)}
.filter-group{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:12px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--blue);color:var(--txt)}
.chip.on{border-color:var(--blue);color:var(--blue);background:rgba(110,168,254,.1)}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.note{padding:14px 18px;font-size:12px;color:var(--sub);line-height:1.9;border-top:1px solid var(--line)}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.turn-green{color:var(--green)!important}
.turn-yellow{color:var(--yellow)!important}
.turn-red{color:var(--red)!important}
.badge.red{background:rgba(248,81,73,.15);color:var(--red)}
.badge.yel{background:rgba(210,153,34,.15);color:var(--yellow)}
.badge.grn{background:rgba(63,185,80,.15);color:var(--green)}
.badge.gry{background:var(--card2);color:var(--sub)}
.hidden{display:none}
.sku-rank{position:absolute;top:2px;left:2px;font-size:10px;color:var(--sub);background:var(--card2);border-radius:4px;padding:1px 5px;z-index:1}
.sku-ph{width:40px;height:40px;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);overflow:hidden;flex-shrink:0}
.sku-ph img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 18px}
.tab{padding:12px 20px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
/* 搜索框 */
.sku-search{width:100%;max-width:360px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.sku-search:focus{border-color:var(--blue)}
.sku-search::placeholder{color:var(--sub)}
.search-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search-bar .cnt{font-size:12px;color:var(--sub)}
/* 预警专区 */
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line)}
.alert-card{background:var(--card);padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--txt)}
.alert-card:hover{background:var(--card2)}
.alert-card .ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.alert-card.r .ic{background:rgba(248,81,73,.15)}
.alert-card.y .ic{background:rgba(210,153,34,.15)}
.alert-card.p .ic{background:rgba(188,140,255,.15)}
.alert-card .lab{font-size:11px;color:var(--sub)}
.alert-card .num{font-size:22px;font-weight:700;font-family:'SF Mono',monospace;line-height:1.2}
.alert-card .sub2{font-size:11px;color:var(--sub)}
.alert-card.r .num{color:var(--red)}.alert-card.y .num{color:var(--yellow)}.alert-card.p .num{color:var(--purple)}
.badge.urg{background:rgba(248,81,73,.18);color:var(--red)}
.badge.mid{background:rgba(210,153,34,.18);color:var(--yellow)}
.badge.norm{background:rgba(63,185,80,.15);color:var(--green)}
.thresh-note{font-size:11px;color:var(--sub);padding:10px 18px;border-top:1px solid var(--line)}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
const COLORS=['#6ea8fe','#3fb950','#bc8cff','#db6d28','#d29922'];
const SELLERS={'ADIYJW0UXJYNU':{name:'日本-亚马逊',key:'amazonJP',cur:'JPY'},'A3WVG9GU455RD':{name:'美国-亚马逊',key:'amazonUS',cur:'USD'}};
let DATA={};
let curTab='cloud';
let curSkuPlatform=null;
let curSearch='';
// 每个Tab独立的排序状态
const SORTS={
  cloud:{key:'cloudQty',dir:-1},
  jst:{key:'qty',dir:-1},
  crossborder:{key:'dayEndCount',dir:-1},
  fba:{key:'endAmount',dir:-1},
  overseas:{key:'dayEndCount',dir:-1}
};
// 预警/补货阈值（建议值，可按业务调整）
const CFG={lowDays:30,urgentDays:15,coverTargetDays:45,deadMonths:3};

try{DATA=JSON.parse(document.getElementById('DATA-JSON').textContent)}catch(e){}

const fmt0=v=>Math.round(Number(v)||0).toLocaleString();
const fmt2=v=>(Number(v)||0).toFixed(2).replace(/\B(?=(\d{3})+\.)/g,',').replace(/\.00$/,'');
const num=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sortIcon=(tab,k)=>{const s=SORTS[tab];return s.key===k?(s.dir>0?' ↑':' ↓'):''};
// 通用排序：数字按数值，其他按字符串
function sortedRows(list,tab){
  const s=SORTS[tab];const k=s.key;
  return list.slice().sort((a,b)=>{
    let va=a[k],vb=b[k];
    const na=Number(va),nb=Number(vb);
    if(va!==''&&vb!==''&&isFinite(na)&&isFinite(nb))return s.dir*(na-nb);
    va=String(va||'').toLowerCase();vb=String(vb||'').toLowerCase();
    return s.dir*va.localeCompare(vb,'zh');
  });
}
// 关键词过滤（SKU/品名等多字段）
function filterKw(list,fields){
  const kw=curSearch.trim().toLowerCase();
  if(!kw)return list;
  return list.filter(r=>fields.some(f=>String(r[f]==null?'':r[f]).toLowerCase().includes(kw)));
}
// 搜索框HTML
function searchBar(ph,total,shown){
  return `<div class="search-bar">
    <input class="sku-search" id="skuSearch" type="text" placeholder="${ph}" value="${esc(curSearch)}">
    <span class="cnt">${curSearch.trim()?`匹配 ${shown} / ${total} 个SKU`:`共 ${total} 个SKU`}</span>
  </div>`;
}
// 非卖品/测试SKU排除
const NON_SKU=/邮费|补差价|补差链接|处理品|放心购|快递.*消毒|test/i;

function render(){
  const d=DATA;
  document.getElementById('meta').textContent='数据更新：'+(d.meta&&d.meta.generatedAt||'?')+' · 来源：领星ERP + 聚水潭';

  if(curTab==='cloud') renderCloud(d);
  else if(curTab==='jst') renderJst(d);
  else if(curTab==='crossborder') renderCrossBorder(d);
  else if(curTab==='fba') renderFBA(d);
  else renderOverseas(d);
}

// ========== 云端总仓（全渠道库存合并 + 周转率 + 预警补货）==========
function renderCloud(d){
  const cw=d.cloudWarehouse||{};
  if(!cw.skuCount){
    document.getElementById('panel').innerHTML='<div class="sec"><h2>云端总仓</h2><div style="color:var(--sub);padding:40px;text-align:center">暂无云端总仓数据</div></div>';
    return;
  }

  // 周转率颜色
  const turnCls=t=>{
    if(t===0||t===999)return 'turn-red';
    if(t<=1)return 'turn-green';
    if(t<=3)return 'turn-yellow';
    return 'turn-red';
  };
  const turnLabel=t=>{
    if(t===0)return '—';
    if(t>=999)return '无销量';
    return t.toFixed(1);
  };
  const daysLabel=t=>{
    if(t===0)return '—';
    if(t>=9999)return '∞';
    return Math.round(t);
  };

  // ===== 预警 & 补货计算（全量SKU，排除非卖品/测试SKU）=====
  const all=(cw.skuDetail||[]).filter(x=>!NON_SKU.test((x.name||'')+' '+(x.sku||'')));
  // 包材物料（吊牌/织唛/合格证/说明书等，前缀 WL- / CS-WL-）：计入销量但不参与缺货/补货预警（按成品销售速度给耗材下补货单无意义）
  const MATERIAL_SKU=/^(WL-|CS-WL-)/i;
  const isMaterial=x=>MATERIAL_SKU.test(x.sku||'')||/物料|说明书|合格证|织唛|吊牌|拉尾绳|白包装|包材|包装袋/.test(x.name||'');
  const alertAll=all.filter(x=>!isMaterial(x));
  const dm=/(\d{4})-(\d{2})-(\d{2})/.exec((d.meta&&d.meta.generatedAt)||'');
  const elapsed=dm?Math.max(1,num(dm[3])):30;

  const oos=[],low=[],dead=[];
  for(const x of alertAll){
    const stock=num(x.cloudQty),sales=num(x.salesQty);
    const daily=sales/elapsed;
    x._daily=daily;
    x._cover=daily>0?stock/daily:(stock>0?99999:0);
    x._suggest=daily>0?Math.max(0,Math.ceil(daily*CFG.coverTargetDays-stock-num(x.inTransitQty))):0;
    if(stock===0){ if(sales>0)oos.push(x); }
    else if(stock>0){
      if(sales>0&&x._cover<CFG.lowDays)low.push(x);
      if(sales===0||num(x.turnover)>CFG.deadMonths)dead.push(x);
    }
    // stock<0 为ERP库存数据异常，不纳入预警（避免误报缺货）
  }
  // 状态按"现货+在途"总覆盖天数判定：<15天紧急 / <30天需补货 / ≥30天在途补给中
  const statusOf=x=>{
    const pipe=x._daily>0?(num(x.cloudQty)+num(x.inTransitQty))/x._daily:99999;
    if(pipe<CFG.urgentDays)return {cls:'urg',txt:num(x.cloudQty)===0?'紧急断货':'紧急',rank:0};
    if(pipe<CFG.lowDays)return {cls:'mid',txt:'需补货',rank:1};
    return {cls:'norm',txt:'在途补给中',rank:2};
  };
  const replenish=[...oos,...low].sort((a,b)=>{
    const sa=statusOf(a),sb=statusOf(b);
    return sa.rank-sb.rank||b._suggest-a._suggest||num(b.salesQty)-num(a.salesQty);
  });
  dead.sort((a,b)=>num(b.cloudQty)-num(a.cloudQty));
  const deadQty=dead.reduce((s,x)=>s+num(x.cloudQty),0);

  const skuCell=(r,ph)=>`<div style="display:flex;align-items:center;gap:10px">
      <div style="position:relative;flex-shrink:0"><span class="sku-rank">${ph||'云'}</span><div class="sku-ph">云</div></div>
      <div style="min-width:0"><div style="font-family:monospace;font-size:12px;word-break:break-all">${esc(r.sku)}</div>${r.name?`<div style="font-size:11px;color:var(--sub);margin-top:2px;line-height:1.3">${esc(r.name)}</div>`:''}</div>
    </div>`;

  // 补货优先级表
  const repTop=replenish.slice(0,20),repRest=replenish.slice(20);
  const repRow=(r,cls)=>{
    const st=statusOf(r);
    const pipe=r._daily>0?(num(r.cloudQty)+num(r.inTransitQty))/r._daily:99999;
    return `<tr${cls?` class="${cls}"`:''}>
    <td>${skuCell(r)}</td>
    <td style="text-align:right;font-weight:600">${fmt0(r.cloudQty)}</td>
    <td style="text-align:right;color:var(--yellow)">${fmt0(r.inTransitQty)}</td>
    <td style="text-align:right;color:var(--blue)">${fmt0(r.salesQty)}</td>
    <td style="text-align:right">${r._daily.toFixed(1)}</td>
    <td style="text-align:right" class="${r._cover<CFG.urgentDays?'turn-red':r._cover<CFG.lowDays?'turn-yellow':'turn-green'}">${r._cover>=99999?'∞':Math.round(r._cover)}<small>天</small><div style="font-size:10px;color:var(--sub);font-weight:400">含在途 ${pipe>=99999?'∞':Math.round(pipe)}天</div></td>
    <td style="text-align:right;font-weight:600;color:var(--orange)">${r._suggest?fmt0(r._suggest):'—'}</td>
    <td><span class="badge ${st.cls}">${st.txt}</span></td>
  </tr>`;};
  const repHTML=replenish.length?`<div class="sec" id="alert-replenish">
    <h2>补货优先级清单 <span class="sub">缺货 + 现货可卖&lt;${CFG.lowDays}天 · 共 ${replenish.length} 个SKU · 按紧迫度排序</span></h2>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>SKU / 产品</th>
        <th style="text-align:right">现货</th>
        <th style="text-align:right">在途</th>
        <th style="text-align:right">本月销量</th>
        <th style="text-align:right">日均销量</th>
        <th style="text-align:right">现货可卖</th>
        <th style="text-align:right">建议补货量</th>
        <th>状态</th>
      </tr></thead>
      <tbody>
        ${repTop.map(r=>repRow(r)).join('')}
        ${repRest.map(r=>repRow(r,'sku-rest hidden')).join('')}
      </tbody>
    </table></div>
    ${repRest.length?`<div style="margin-top:10px;text-align:center"><button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px">展开剩余 ${repRest.length} 条 ▼</button></div>`:''}
    <div class="thresh-note">建议补货量 = 日均销量 × ${CFG.coverTargetDays}天 − 现货 − 在途（${CFG.coverTargetDays}天备货口径，含头程周期；仅为决策参考，下单前请结合MOQ与生产周期确认）</div>
  </div>`:'';

  // 滞销积压表
  const deadTop=dead.slice(0,20),deadRest=dead.slice(20);
  const deadRow=(r,cls)=>`<tr${cls?` class="${cls}"`:''}>
    <td>${skuCell(r)}</td>
    <td style="text-align:right;font-weight:600">${fmt0(r.cloudQty)}</td>
    <td style="text-align:right;font-size:11px;color:var(--sub)">总${fmt0(r.jstQty)}·跨${fmt0(r.localQty)}·F${fmt0(r.fbaQty)}·海${fmt0(r.overseasQty)}</td>
    <td style="text-align:right;color:var(--blue)">${fmt0(r.salesQty)}</td>
    <td class="${turnCls(r.turnover)}" style="text-align:right;font-weight:600">${turnLabel(r.turnover)}</td>
    <td><span class="badge ${r.salesQty===0?'gry':'yel'}">${r.salesQty===0?'本月零销量':'周转>'+CFG.deadMonths+'月'}</span></td>
  </tr>`;
  const deadHTML=dead.length?`<div class="sec" id="alert-dead">
    <h2>滞销积压预警 <span class="sub">现货&gt;0 且 本月零销量 或 周转率&gt;${CFG.deadMonths}月 · ${dead.length}个SKU / ${fmt0(deadQty)}件</span></h2>
    <div class="table-wrap"><table>
      <thead><tr>
        <th>SKU / 产品</th>
        <th style="text-align:right">现货库存</th>
        <th style="text-align:right">分仓(总/跨/F/海)</th>
        <th style="text-align:right">本月销量</th>
        <th style="text-align:right">周转率</th>
        <th>判定</th>
      </tr></thead>
      <tbody>
        ${deadTop.map(r=>deadRow(r)).join('')}
        ${deadRest.map(r=>deadRow(r,'sku-rest hidden')).join('')}
      </tbody>
    </table></div>
    ${deadRest.length?`<div style="margin-top:10px;text-align:center"><button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px">展开剩余 ${deadRest.length} 条 ▼</button></div>`:''}
  </div>`:'';

  // ===== 明细（搜索 + 排序；搜索时展示全部匹配，否则Top20）=====
  // 基表保留零库存SKU（搜索可查断货/物料SKU）；默认按库存降序，首屏仍只展示库存Top20
  const stockAll=all;
  const filtered=sortedRows(filterKw(stockAll,['sku','name']),'cloud');
  const searching=!!curSearch.trim();
  const top20=filtered.slice(0,20),rest=filtered.slice(20);

  const rowHTML=(r,i,cls)=>`<tr${cls?` class="${cls}"`:''}>
    <td>${skuCell(r,i)}</td>
    <td style="text-align:right;font-weight:600" data-sort-num="cloudQty">${fmt0(r.cloudQty)}</td>
    <td style="text-align:right;font-size:11px;color:var(--sub)">总${fmt0(r.jstQty)}·跨${fmt0(r.localQty)}·F${fmt0(r.fbaQty)}·海${fmt0(r.overseasQty)}</td>
    <td style="text-align:right;color:var(--yellow)">${fmt0(r.inTransitQty)}</td>
    <td style="text-align:right;color:var(--blue)">${fmt0(r.salesQty)}</td>
    <td class="${turnCls(r.turnover)}" style="text-align:right;font-weight:600">${turnLabel(r.turnover)}<small style="font-weight:400">月</small></td>
    <td class="${turnCls(r.turnover)}" style="text-align:right">${daysLabel(r.turnoverDays)}</td>
  </tr>`;

  let html=`<div class="sec">
    <h2>库存预警总览 <span class="sub">按本月${elapsed}天实际净销量测算 · 全渠道合并口径 · 已排除包材物料（WL-/CS-WL-）</span></h2>
    <div class="alert-grid">
      <a class="alert-card r" href="#alert-replenish">
        <div class="ic">🚨</div>
        <div><div class="lab">缺货（现货=0且本月有销量）</div><div class="num">${oos.length}<small style="font-size:12px"> 个SKU</small></div><div class="sub2">正在断货，需立即处理</div></div>
      </a>
      <a class="alert-card y" href="#alert-replenish">
        <div class="ic">⚠️</div>
        <div><div class="lab">低库存（现货可卖&lt;${CFG.lowDays}天）</div><div class="num">${low.length}<small style="font-size:12px"> 个SKU</small></div><div class="sub2">含在途仍不足的需尽快下单</div></div>
      </a>
      <a class="alert-card p" href="#alert-dead">
        <div class="ic">📦</div>
        <div><div class="lab">滞销积压（&gt;${CFG.deadMonths}月/零销量）</div><div class="num">${dead.length}<small style="font-size:12px"> 个 · ${fmt0(deadQty)}件</small></div><div class="sub2">建议清仓/促销/停补</div></div>
      </a>
    </div>
  </div>
  ${repHTML}
  ${deadHTML}
  <div class="sec">
    <h2>云端总仓 <span class="sub">全渠道库存合并 · 聚水潭 + 跨境仓 + FBA + 海外仓 + 在途</span></h2>
    <div class="kpi-grid">
      <div class="kpi info"><div class="label">现货库存</div><div class="v">${fmt0(cw.totalCloudQty)}<small>件</small></div></div>
      <div class="kpi warn"><div class="label">在途库存</div><div class="v">${fmt0(cw.totalInTransit)}<small>件</small></div></div>
      <div class="kpi pos"><div class="label">本月销售</div><div class="v">${fmt0(cw.totalSales)}<small>件</small></div></div>
      <div class="kpi"><div class="label">整体周转率</div><div class="v ${turnCls(cw.turnoverOverall)}">${cw.turnoverOverall.toFixed(1)}<small>月</small></div></div>
      <div class="kpi"><div class="label">有库存SKU</div><div class="v">${cw.withStock}<small>个</small></div></div>
    </div>
    <div class="note">
      · <b>云端总仓</b> = 聚水潭总仓 + 跨境仓 + FBA仓 + 海外仓（按SKU合并）<br>
      · <b>本月销量</b> = 聚水潭有效订单（已发货/待发货/待审核，含线下大单；已剔除取消/合并/拆分单，数量−退款数量）+ 领星日亚（销售−退款）+ <b style="color:#07c">天猫（生意参谋商品排行导出·支付件数口径，未扣退款件数）</b><br>
      · 天猫因奇门接口未恢复走人工/自动导出兜底，货号=SKU；奇门恢复、聚水潭能拉到天猫单后本兜底自动停用，防双算<br>
      · <b>周转率</b> = 现货库存 ÷ 本月销售量（数值越小周转越快，>3月为积压）<br>
      · <b>周转天数</b> = 周转率 × 30（按本月销售速度，库存可卖天数）<br>
      · <b>在途</b> = 聚水潭采购在途 + 跨境仓调拨在途 + 海外仓在途
    </div>
  </div>
  <div class="sec">
    <h2>SKU 库存与周转明细 <span class="sub">${searching?'搜索结果 · 按选中列排序':'点击表头排序 · 默认Top 20'}</span></h2>
    ${searchBar('搜索 SKU 编码或中文品名…',stockAll.length,filtered.length)}
    <div class="table-wrap"><table>
      <thead><tr>
        <th>SKU / 产品</th>

// ========== FBA 库存 ==========
function renderFBA(d){
  const fba=d.fba||{};
  // 找有数据的店铺
  const candidates=Object.entries(fba).filter(([k,v])=>v&&v.endCount!=null);
  if(!candidates.length){
    document.getElementById('panel').innerHTML='<div class="sec"><h2>FBA库存</h2><div style="color:var(--sub);padding:40px;text-align:center">暂无FBA库存数据</div></div>';
    return;
  }

  // 汇总KPI
  let totalEnd=0,totalOnWay=0,totalReceipts=0,totalReturns=0,totalDamaged=0;
  for(const [k,v] of candidates){
    totalEnd+=num(v.endCount);
    totalOnWay+=num(v.endOnWayCount);
    totalReceipts+=num(v.receiptsCount);
    totalReturns+=num(v.customerReturnsCount);
    totalDamaged+=num(v.damagedCount)+num(v.lostCount);
  }

  // 各店铺KPI卡片
  const storeKPIs=candidates.map(([k,v])=>{
    const info=SELLERS[v.sellerId]||{name:v.storeName||k,cur:'JPY'};
    return `<div class="kpi ${v.endCount>0?'pos':'gry'}">
      <div class="label">${info.name}</div>
      <div class="v">${fmt0(v.endCount)}<small>${info.cur}</small></div>
      <div class="delta">期末库存 · 成本 ¥${fmt2(v.endAmount)}</div>
    </div>`;
  }).join('');

  let html=`<div class="sec">
    <h2>FBA库存总览 <span class="sub">本月 · 按店铺</span></h2>
    <div class="kpi-grid">
      <div class="kpi info"><div class="label">总期末库存</div><div class="v">${fmt0(totalEnd)}<small>件</small></div></div>
      <div class="kpi warn"><div class="label">总在途库存</div><div class="v">${fmt0(totalOnWay)}<small>件</small></div></div>
      <div class="kpi pos"><div class="label">本月入库</div><div class="v">${fmt0(totalReceipts)}<small>件</small></div></div>
      <div class="kpi neg"><div class="label">退货+残损</div><div class="v">${fmt0(totalReturns+totalDamaged)}<small>件</small></div></div>
      ${storeKPIs}
    </div>
  </div>`;

  // SKU明细
  const platforms=candidates.map(([k,v])=>{
    const info=SELLERS[v.sellerId]||{name:v.storeName||k,cur:'JPY'};
    return{name:info.name,key:k,list:v.skuDetail||[],currency:info.cur,endCount:v.endCount,endAmount:v.endAmount};
  }).filter(p=>p.list.length>0);

  if(!curSkuPlatform||!platforms.find(p=>p.key===curSkuPlatform)){
    curSkuPlatform=platforms.length?[...platforms].sort((a,b)=>b.endAmount-a.endAmount)[0].key:null;
  }

  const chips=platforms.map(p=>{
    const color=COLORS[platforms.indexOf(p)%COLORS.length];
    return `<span class="chip ${p.key===curSkuPlatform?'on':''}" data-skup="${p.key}"><span class="dot" style="background:${color}"></span>${p.name} <span style="opacity:.7">(${p.list.length})</span></span>`;
  }).join('');

  const cur=platforms.find(p=>p.key===curSkuPlatform)||platforms[0];
  const searching=!!curSearch.trim();
  const listAll=cur.list||[];
  const list=sortedRows(filterKw(listAll,['msku','fnsku','productName','localSku']),'fba');
  const top20=list.slice(0,20);
  const rest=list.slice(20);

  const rowHTML=(r,i,cls)=>{
    const stockStatus=r.endCount>20?'grn':r.endCount>0?'yel':'red';
    const stockBadge=`<span class="badge ${stockStatus}">${r.endCount>20?'充足':r.endCount>0?'偏低':'缺货'}</span>`;
    return `<tr${cls?` class="${cls}"`:''}>
      <td><div style="display:flex;align-items:center;gap:10px">
        <div style="position:relative;flex-shrink:0"><span class="sku-rank">${i}</span><div class="sku-ph">${r.fnsku?'FBA':'—'}</div></div>
        <div style="min-width:0"><div style="font-family:monospace;font-size:12px;word-break:break-all">${esc(r.msku||r.fnsku||'—')}</div>${r.productName?`<div style="font-size:11px;color:var(--txt);margin-top:2px;line-height:1.3">${esc(r.productName)}</div>`:''}${r.localSku?`<div style="font-size:10px;color:var(--sub);margin-top:1px">本地SKU：${esc(r.localSku)}</div>`:''}</div>
      </div></td>
      <td>${fmt0(r.endCount)}</td>
      <td>${fmt2(r.endAmount)}<span style="color:var(--sub);font-size:11px;margin-left:2px">${cur.currency}</span></td>
      <td>${fmt0(r.endOnWayCount)}</td>
      <td>${fmt0(r.receiptsCount)}</td>
      <td>${fmt0(r.customerReturnsCount)}</td>
      <td>${fmt0(num(r.damagedCount)+num(r.lostCount))}</td>
      <td>${stockBadge}</td>

  html+=`<div class="sec">

    <div class="table-wrap"><table>
      <thead><tr>
        <th data-sort="msku">MSKU / 产品${sortIcon('fba','msku')}</th>
        <th data-sort="endCount" style="text-align:right">期末库存${sortIcon('fba','endCount')}</th>
        <th data-sort="endAmount" style="text-align:right">库存成本${sortIcon('fba','endAmount')}</th>
        <th data-sort="endOnWayCount" style="text-align:right">在途${sortIcon('fba','endOnWayCount')}</th>
        <th data-sort="receiptsCount" style="text-align:right">入库${sortIcon('fba','receiptsCount')}</th>
        <th data-sort="customerReturnsCount" style="text-align:right">退货${sortIcon('fba','customerReturnsCount')}</th>
        <th data-sort="damagedCount" style="text-align:right">残损+丢失${sortIcon('fba','damagedCount')}</th>
        <th>状态</th>
      </tr></thead>
      <tbody>
        ${top20.map((r,i)=>rowHTML(r,i+1)).join('')}
        ${searching?rest.map((r,i)=>rowHTML(r,i+21)).join(''):rest.map((r,i)=>rowHTML(r,i+21,'sku-rest hidden')).join('')}
      </tbody>
    </table></div>
    ${(!searching&&rest.length)?`<div style="margin-top:10px;text-align:center"><button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px">展开剩余 ${rest.length} 条 ▼</button></div>`:''}
    ${searching&&!list.length?'<div style="color:var(--sub);padding:30px;text-align:center">没有匹配的SKU</div>':''}
    <div class="note">
      · 数据源：领星ERP · FBA新版库存报表（月度汇总）<br>
      · 期末库存=当月最后一天的FBA在仓库存（可售+预留+残损）；在途=调拨在途<br>

        <th data-sort="dayEndCount" style="text-align:right">期末库存${sortIcon('crossborder','dayEndCount')}</th>
        <th data-sort="allocationInTransitCount" style="text-align:right">在途${sortIcon('crossborder','allocationInTransitCount')}</th>
        <th data-sort="purchaseInCount" style="text-align:right">采购入库${sortIcon('crossborder','purchaseInCount')}</th>
        <th data-sort="fbaOutCount" style="text-align:right">FBA出库${sortIcon('crossborder','fbaOutCount')}</th>
        <th>所在仓库</th>
      </tr></thead>
      <tbody>
        ${top20.map((r,i)=>rowHTML(r,i+1)).join('')}
        ${searching?rest.map((r,i)=>rowHTML(r,i+21)).join(''):rest.map((r,i)=>rowHTML(r,i+21,'sku-rest hidden')).join('')}
      </tbody>
    </table></div>
    ${(!searching&&rest.length)?`<div style="margin-top:10px;text-align:center"><button id="skuToggle" style="background:var(--card2);border:1px solid var(--line);color:var(--sub);padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px">展开剩余 ${rest.length} 条 ▼</button></div>`:''}
    ${searching&&!list.length?'<div style="color:var(--sub);padding:30px;text-align:center">没有匹配的SKU</div>':''}
    <div class="note">
      · 数据源：领星ERP · 本地仓库存报表<br>
      · 跨境仓=国内备货发往海外的仓库（跨境仓库-日本等）<br>
      · 期末=当期末在仓库存；在途=仓间调拨在途<br>
      · FBA出库=本月发往FBA仓的数量
    </div>
  </div>`;

  document.getElementById('panel').innerHTML=html;
  bindSkuEvents();
}

// ========== 事件绑定 ==========
let searchFocus=false;
function bindSkuEvents(){
  document.querySelectorAll('[data-tab]').forEach(t=>{
    t.onclick=()=>{curTab=t.dataset.tab;curSearch='';curSkuPlatform=null;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===t));render();};
  });
  document.querySelectorAll('[data-skup]').forEach(c=>{
    c.onclick=()=>{curSkuPlatform=c.dataset.skup;render();};
  });
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.onclick=()=>{
      const st=SORTS[curTab];const k=th.dataset.sort;
      if(st.key===k) st.dir=-st.dir;
      else {st.key=k;st.dir=-1;}
      render();
    };
  });
  // 每个区块独立的“展开剩余”按钮（同页可能有多个）
  document.querySelectorAll('button#skuToggle').forEach(btn=>{
    btn.onclick=()=>{
      const sec=btn.closest('.sec');if(!sec)return;
      const rows=sec.querySelectorAll('tr.sku-rest');
      if(!rows.length)return;
      const hidden=rows[0].classList.contains('hidden');
      rows.forEach(r=>r.classList.toggle('hidden',!hidden));
      btn.textContent=hidden?'收起 ▲':`展开剩余 ${rows.length} 条 ▼`;
    };
  });
  // SKU搜索（输入即筛选，重渲染后保持焦点）
  const si=document.getElementById('skuSearch');
  if(si){
    si.oninput=()=>{curSearch=si.value;searchFocus=true;render();};
    if(searchFocus){const p=si.value.length;si.focus();si.setSelectionRange(p,p);}
    searchFocus=false;
  }
  // 预警卡片锚点滚动偏移（避开吸顶头部）
  if(location.hash){const el=document.querySelector(location.hash);if(el)el.scrollIntoView();}
}

render();
</script>
